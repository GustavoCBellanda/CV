<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gustavo Bellanda</title>
    <meta
      name="description"
      content="Software architect and engineer — choose your language."
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      (function () {
        var k = "lang";
        var legacy = "portfolio-lang";
        var pref = localStorage.getItem(k) || localStorage.getItem(legacy);
        if (pref === "en") {
          window.location.replace("en.html");
        } else if (pref === "pt") {
          window.location.replace("pt-br.html");
        }
      })();
    </script>
  </head>
  <body class="gate-page">
    <div class="gate">
      <div class="gate__photo">
        <img
          class="gate__profile"
          src="assets/img/profile.jpg"
          width="800"
          height="800"
          alt=""
          decoding="async"
        />
      </div>
      <h1 class="gate__brand">Gustavo Bellanda</h1>
    </div>
    <script>
      (function () {
        var k = "lang";
        var legacy = "portfolio-lang";
        if (localStorage.getItem(k) || localStorage.getItem(legacy)) return;
        fetch("https://get.geojs.io/v1/ip/country.json", {
          credentials: "omit",
        })
          .then(function (r) {
            if (!r.ok) throw new Error("geo");
            return r.json();
          })
          .then(function (d) {
            var code = String(d.country || "").toUpperCase();
            var isBr = code === "BR";
            localStorage.setItem(k, isBr ? "pt" : "en");
            window.location.replace(isBr ? "pt-br.html" : "en.html");
          })
          .catch(function () {
            localStorage.setItem(k, "en");
            window.location.replace("en.html");
          });
      })();
    </script>
  </body>
</html>
